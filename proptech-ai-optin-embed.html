<!-- ===================================================================
     PropTech AI — "Start a campaign" opt-in form (embed snippet)
     v618.  Paste into an HTML / embed block on proptechnologyai.com.

     THIS IS COMPLIANCE EVIDENCE, not just a lead form. The 10DLC campaign
     declares that subscribers opt in here, and the carrier opens this URL
     and compares the page against the filing. So:

       * the consent box is UNTICKED and NOT required — consent may never be
         a condition of doing business;
       * the wording posted to the server is read out of the DOM, so what is
         stored is what the visitor actually saw;
       * frequency, "msg & data rates may apply", STOP and HELP sit next to
         the box, because reviewers look for them;
       * the consent covers customer care AND marketing, because the use case
         is Mixed. PrimeHome's first filing was rejected for consent narrower
         than its use case.

     Every class is prefixed .ptai- so it cannot collide with the site's own
     styles, and nothing here loads an external script or font.

     Before filing the campaign: replace the two policy links below with real
     URLs. A reviewer WILL click them, and a 404 fails the filing.
     =================================================================== -->

<div class="ptai-optin">
  <form id="ptai-form" novalidate>
    <div class="ptai-row">
      <div>
        <label for="ptai-first">First name <span class="ptai-req">*</span></label>
        <input id="ptai-first" type="text" autocomplete="given-name">
      </div>
      <div>
        <label for="ptai-last">Last name</label>
        <input id="ptai-last" type="text" autocomplete="family-name">
      </div>
    </div>

    <label for="ptai-company">Company</label>
    <input id="ptai-company" type="text" autocomplete="organization">

    <div class="ptai-row">
      <div>
        <label for="ptai-phone">Mobile number</label>
        <input id="ptai-phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(312) 555-0123">
      </div>
      <div>
        <label for="ptai-email">Email</label>
        <input id="ptai-email" type="email" autocomplete="email" placeholder="you@company.com">
      </div>
    </div>
    <p class="ptai-hint">Give us at least one — whichever you would rather we used.</p>

    <label for="ptai-notes">What do you need?</label>
    <textarea id="ptai-notes"
      placeholder="Markets you buy in, how many callers you are considering, anything else useful."></textarea>

    <!-- Honeypot: hidden from people, irresistible to bots. Do not remove;
         this page will be crawled once the filing links to it. -->
    <div class="ptai-hp" aria-hidden="true">
      <label for="ptai-website">Website</label>
      <input id="ptai-website" type="text" tabindex="-1" autocomplete="off">
    </div>

    <div class="ptai-consent">
      <span class="ptai-optional">Optional</span>
      <label class="ptai-check">
        <input type="checkbox" id="ptai-consent">
        <span id="ptai-consent-text">I agree to receive text messages from PropTech AI at the
          mobile number provided, including customer care messages about this enquiry
          (scheduling, onboarding and follow-up questions) and marketing messages about
          PropTech AI services, offers and promotions. Consent is not a condition of
          purchase. Message frequency varies, up to about 8 messages a month. Message and
          data rates may apply. Reply STOP to unsubscribe or HELP for help.</span>
      </label>
      <p class="ptai-terms">
        See our <a href="https://proptechnologyai.com/privacy" target="_blank" rel="noopener">Privacy Policy</a>
        and <a href="https://proptechnologyai.com/terms" target="_blank" rel="noopener">Terms of Service</a>.
        We do not sell or share your information with third parties for marketing.
      </p>
    </div>

    <button type="submit" id="ptai-send">Send my details</button>
    <div class="ptai-msg" id="ptai-msg" role="status" aria-live="polite"></div>
  </form>
</div>

<style>
.ptai-optin{--ptai-ink:#111418;--ptai-muted:#5b6570;--ptai-line:#dfe4ea;
  --ptai-brand:#0c6b6b;--ptai-err:#b3261e;--ptai-ok:#0f7b4f;
  max-width:640px;margin:0 auto;color:var(--ptai-ink);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#fff;border:1px solid var(--ptai-line);border-radius:14px;padding:24px;
  box-sizing:border-box}
.ptai-optin *{box-sizing:border-box}
.ptai-optin label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px;color:var(--ptai-ink)}
.ptai-optin .ptai-req{color:var(--ptai-err)}
.ptai-optin input[type=text],.ptai-optin input[type=tel],
.ptai-optin input[type=email],.ptai-optin textarea{
  width:100%;padding:11px 12px;border:1px solid var(--ptai-line);border-radius:9px;
  font:inherit;background:#fff;color:var(--ptai-ink)}
.ptai-optin input:focus,.ptai-optin textarea:focus{outline:none;border-color:var(--ptai-brand);
  box-shadow:0 0 0 3px rgba(12,107,107,.12)}
.ptai-optin textarea{min-height:96px;resize:vertical}
.ptai-optin .ptai-hint{color:var(--ptai-muted);font-size:13px;margin:5px 0 0}
.ptai-optin .ptai-row{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:520px){.ptai-optin .ptai-row{grid-template-columns:1fr}}
.ptai-optin .ptai-hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.ptai-optin .ptai-consent{margin-top:22px;padding:16px;border:1px solid var(--ptai-line);
  border-radius:11px;background:#fbfcfd}
.ptai-optin .ptai-check{display:flex;gap:11px;align-items:flex-start;font-weight:400;
  font-size:14.5px;margin:0;cursor:pointer}
.ptai-optin .ptai-check input{margin-top:3px;width:18px;height:18px;flex:0 0 auto;
  accent-color:var(--ptai-brand)}
.ptai-optin .ptai-terms{margin:10px 0 0;color:var(--ptai-muted);font-size:12.5px}
.ptai-optin .ptai-optional{display:inline-block;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;color:var(--ptai-muted);background:#eef1f4;
  border-radius:99px;padding:2px 8px;margin-bottom:9px}
.ptai-optin button{margin-top:22px;width:100%;padding:13px 18px;border:0;border-radius:10px;
  background:var(--ptai-brand);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.ptai-optin button:disabled{opacity:.55;cursor:not-allowed}
.ptai-optin .ptai-msg{margin-top:14px;padding:12px 14px;border-radius:10px;
  font-size:14.5px;display:none}
.ptai-optin .ptai-msg.err{display:block;background:#fdecea;color:var(--ptai-err)}
.ptai-optin .ptai-msg.ok{display:block;background:#e8f5ee;color:var(--ptai-ok)}
</style>

<script>
(function () {
  'use strict';
  var ENDPOINT = 'https://kqfoniinytvuddxiwvkc.supabase.co/functions/v1/proptech-campaign-submit';
  var $ = function (id) { return document.getElementById(id); };
  var form = $('ptai-form'), btn = $('ptai-send'), msg = $('ptai-msg');

  function show(kind, text) { msg.className = 'ptai-msg ' + kind; msg.textContent = text; }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    show('', '');

    var first = $('ptai-first').value.trim();
    var phone = $('ptai-phone').value.trim();
    var email = $('ptai-email').value.trim();

    // Checked here as well as on the server, so nobody waits on a round trip
    // to be told they left their name out.
    if (!first) { show('err', 'Please tell us your name.'); return; }
    if (!phone && !email) {
      show('err', 'Please give a mobile number or an email address so we can reply.');
      return;
    }

    var consented = $('ptai-consent').checked;
    var original = btn.textContent;
    btn.disabled = true; btn.textContent = 'Sending…';

    fetch(ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        first_name: first,
        last_name: $('ptai-last').value.trim(),
        company: $('ptai-company').value.trim(),
        phone: phone,
        email: email,
        notes: $('ptai-notes').value.trim(),
        website: $('ptai-website').value.trim(),   // honeypot
        sms_consent: consented,
        // Read out of the DOM, so the stored record is the wording actually on
        // screen. Edit the copy above and the record follows it, with nobody
        // having to remember a constant somewhere else.
        consent_text: consented
          ? $('ptai-consent-text').textContent.replace(/\s+/g, ' ').trim()
          : null,
        // In an embed this is the iframe's URL, which is still the truest
        // answer to "where was this submitted from".
        source_url: window.location.href
      })
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (res) {
        btn.disabled = false; btn.textContent = original;
        if (!res || !res.ok) {
          show('err', (res && res.error)
            || 'Something went wrong. Please email support@proptechnologyai.com.');
          return;
        }
        form.reset();
        show('ok', 'Thank you — we have your details and will be in touch shortly.');
      })
      .catch(function () {
        btn.disabled = false; btn.textContent = original;
        show('err', 'We could not reach the server. Please email support@proptechnologyai.com.');
      });
  });
})();
</script>
